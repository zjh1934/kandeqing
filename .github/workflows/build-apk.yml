name: 构建安装包

on:
  push:
    branches: [main]
    # 安装包回传、纯文档改动都不再触发，避免自己触发自己
    paths-ignore:
      - 'apk/**'
      - 'promo/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK 30 / build-tools 30.0.3
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM="$(command -v sdkmanager)"; fi
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" --install "platforms;android-30" "build-tools;30.0.3" "platform-tools" >/dev/null
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK=$SDK_DIR" >> "$GITHUB_ENV"

      - name: 恢复固定签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p .toolchain
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > .toolchain/debug.keystore
            echo "已恢复固定签名密钥，本次发版与上一版同签名"
          else
            echo "::warning::未配置 KEYSTORE_B64，本次为临时密钥，装新版需卸载旧版"
          fi

      - name: 构建 APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        # tee 落盘：CI 日志端点被网络策略拦时，还能从仓库里读到真实构建过程
        run: |
          # Actions 默认 shell 只有 -e，不带 pipefail：
          # `cmd | tee` 会把失败脚本的退出码吞成 tee 的 0，出现过「假成功发旧包」。
          set -o pipefail
          echo "== 构建环境 ==" > build.log
          echo "HEAD: $(git rev-parse HEAD)" >> build.log
          grep -n versionCode app/build.gradle >> build.log
          find app/src/main/java -name "*.java" | sort >> build.log
          echo "== 构建输出 ==" >> build.log
          bash build_apk.sh 2>&1 | tee -a build.log

      - name: 失败时把构建日志写回仓库
        if: failure()
        run: |
          if [ -f build.log ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f build.log
            git commit -m "[skip ci] 构建日志" || true
            git push || true
          fi

      - name: 读取版本号
        id: ver
        run: |
          VER=$(grep -oE 'versionName[[:space:]]+"[^"]+"' app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/' | head -1)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "path=apk/看得清-$VER.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: 看得清-${{ steps.ver.outputs.ver }}
          path: ${{ steps.ver.outputs.path }}
          if-no-files-found: error

      - name: 把安装包提交回 apk/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "${{ steps.ver.outputs.path }}"
          if git diff --cached --quiet; then
            echo "安装包无变化，跳过提交"
          else
            git commit -m "[skip ci] 构建 看得清 ${{ steps.ver.outputs.ver }} 安装包"
            git push
          fi

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          APK="${{ steps.ver.outputs.path }}"
          # Release 资产名用 ASCII：接口会把中文字符裁掉（变成 "-3.6.apk"），
          # 仓库 apk/ 里的中文文件名保留，两者是同一个包。
          NAME="kanqing-$VER.apk"
          NOTES="看得清 3.9.10：抓字代码做减法，只留一趟遍历。删掉整个 grabAt / findDeepest / Best 兜底层与 FALLBACK_MAX_WALK=30000 的第二套节点预算——旧版主路径没抓到字时会再 roots()+findDeepest 全树重扫一遍（最多 30000 节点），偏偏这时候最慢，而且读到的只是一块不排序、不切句、不接续读的文本。现在精确命中、48dp 容差最近段、点击高度以下续读、可见性快照重算，全部在同一份快照上完成；scanWindows 两个永远为 true 的死参数也一并删掉，日志简化成「抓字 Nms / M 字」。净减约 110 行，行为不退化：上层大卡片仍压不住下层正文、长列表后半段仍命中、点中间段仍从中间句读、放大态仍拒绝抓字。只改 TextGrabber.java、ComboService 一行注释与自检镜像，移动/放大/状态机/TTS/UI/主题/Logo 一行没动。verify_all 5 suite 三轮全绿，新增「没抓到时也不二次遍历」用例。versionCode 40 可覆盖升级，固定签名不变。详见 CHANGELOG.md。"
          # NOTES_396="看得清 3.9.6：重做一级/二级目录层级，勾换成更克制的蓝色竖条。实机截图暴露的问题不是配色，是三层长得一样：L1 组名只是 12sp 灰小字无标记，L2 设置行 14sp 黑字加蓝色当前值，L3 展开选项还是 14sp、选中项又用蓝色加粗加淡蓝底加勾，蓝色当前值与蓝色选中项同色同字号；而且 SelectRow.toggle 各管各的，音色和读多少能同时展开，两块淡蓝底叠在一起分不清归属。本版：L1 章节加 3dp 蓝竖条 + 13sp 加粗；L2 展开时整行淡底（内缩 4dp 不顶卡片圆角）+ 左侧蓝竖条 + 箭头朝上，明确下面那组选项属于我；L3 缩进 24dp、逐格 2dp 竖引导线串起整组、13sp 次级色，选中项改为引导线上一小段 3dp×18dp 蓝色圆角竖条（取代整块淡蓝底和几何勾），三层共用蓝竖条语言，蓝色只留给章节标记与当前值。手风琴：全局只开一个，点开新的自动收起旧的（静态 WeakReference，Activity recreate 不泄漏）。名称说人话：音色显示晓晓·女声/云希·男声/系统默认，不再暴露 microsoft_zh-CN-XiaoxiaoNeural、NOT_SET；引擎默认项不再带被截一半的包名括号。只改显示 label 与 name 字面量，保存/比对/applyVoice 仍走原始 tag，零风险。本轮只改 Ui.java / TtsManager.java / MainActivity.java 三个 UI 层文件，抓字、移动、放大、状态机、Prefs、主题、3.6 蓝球 Logo 一行没动；verify_all 基线 5 suite 三轮全绿、17 个 Java 语法全过。versionCode 36 可覆盖升级，固定签名不变。详见 CHANGELOG.md。"
          if ! gh release view "v$VER" >/dev/null 2>&1; then
            gh release create "v$VER" --title "看得清 $VER" --notes "$NOTES"
          fi
          RID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VER" --jq .id)
          for AID in $(gh api "repos/$GITHUB_REPOSITORY/releases/$RID/assets" --jq '.[].id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$AID" >/dev/null
          done
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$APK" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RID/assets?name=$NAME" >/dev/null
          echo "已发布 $NAME"
