name: 构建安装包

on:
  push:
    branches: [main]
    # 安装包回传、纯文档改动都不再触发，避免自己触发自己
    paths-ignore:
      - 'apk/**'
      - 'promo/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK 30 / build-tools 30.0.3
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM="$(command -v sdkmanager)"; fi
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" --install "platforms;android-30" "build-tools;30.0.3" "platform-tools" >/dev/null
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK=$SDK_DIR" >> "$GITHUB_ENV"

      - name: 恢复固定签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p .toolchain
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > .toolchain/debug.keystore
            echo "已恢复固定签名密钥，本次发版与上一版同签名"
          else
            echo "::warning::未配置 KEYSTORE_B64，本次为临时密钥，装新版需卸载旧版"
          fi

      - name: 构建 APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        # tee 落盘：CI 日志端点被网络策略拦时，还能从仓库里读到真实构建过程
        run: |
          # Actions 默认 shell 只有 -e，不带 pipefail：
          # `cmd | tee` 会把失败脚本的退出码吞成 tee 的 0，出现过「假成功发旧包」。
          set -o pipefail
          echo "== 构建环境 ==" > build.log
          echo "HEAD: $(git rev-parse HEAD)" >> build.log
          grep -n versionCode app/build.gradle >> build.log
          find app/src/main/java -name "*.java" | sort >> build.log
          echo "== 构建输出 ==" >> build.log
          bash build_apk.sh 2>&1 | tee -a build.log

      - name: 失败时把构建日志写回仓库
        if: failure()
        run: |
          if [ -f build.log ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f build.log
            git commit -m "[skip ci] 构建日志" || true
            git push || true
          fi

      - name: 读取版本号
        id: ver
        run: |
          VER=$(grep -oE 'versionName[[:space:]]+"[^"]+"' app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/' | head -1)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "path=apk/看得清-$VER.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: 看得清-${{ steps.ver.outputs.ver }}
          path: ${{ steps.ver.outputs.path }}
          if-no-files-found: error

      - name: 把安装包提交回 apk/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "${{ steps.ver.outputs.path }}"
          if git diff --cached --quiet; then
            echo "安装包无变化，跳过提交"
          else
            git commit -m "[skip ci] 构建 看得清 ${{ steps.ver.outputs.ver }} 安装包"
            git push
          fi

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          APK="${{ steps.ver.outputs.path }}"
          # Release 资产名用 ASCII：接口会把中文字符裁掉（变成 "-3.6.apk"），
          # 仓库 apk/ 里的中文文件名保留，两者是同一个包。
          NAME="kanqing-$VER.apk"
          NOTES="看得清 3.9.4：补「读多少」选项，修设计不对称。查证：整仓 15 个提交、全部历史 APK（2.0 到 3.7）、所有预览脚本里从来没出现过「读多少」这个选项，早期版本一律是「从点的那句一路念到这一屏结束」，没有上界。3.9.3 刚把「点哪里就从哪里开始读」修好，起点可控、终点却完全不可控，设计不对称：一屏上千字时点一下就被迫听几分钟，想停只能再点球；有时只想确认一个词（药名、金额）也要等整屏。判定不合理，补上。朗读页「声音」组加第三行「读多少」，复用 3.9.3 通过的就地展开单选菜单，三档：只读一句 / 读到段末 / 读到屏底（默认，保持早期行为，老用户升级不变）。实现：Prefs 新增 read_scope 键与三档常量；TextGrabber.grabFrom 开头重读，join/joinBelow 按范围裁切，firstSentence 截到第一个句末标点（没有标点就整段返回，绝不切成空串）；不加新类、不加线程、不碰 BallController/ComboService/移动逻辑。verify_grabber.py 镜像同步，新增 6 用例含反向验证（三档逐档变短、旧行为必被抓出、未命中时也生效），基线 5 suite 三轮全绿、17 个 Java 语法全过。核心代码仍是 3.9.2 还原后的早期版本，Logo 仍是 3.6 蓝色玻璃球。versionCode 34 可覆盖升级，固定签名不变。详见 CHANGELOG.md。"
          if ! gh release view "v$VER" >/dev/null 2>&1; then
            gh release create "v$VER" --title "看得清 $VER" --notes "$NOTES"
          fi
          RID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VER" --jq .id)
          for AID in $(gh api "repos/$GITHUB_REPOSITORY/releases/$RID/assets" --jq '.[].id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$AID" >/dev/null
          done
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$APK" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RID/assets?name=$NAME" >/dev/null
          echo "已发布 $NAME"
