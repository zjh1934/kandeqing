name: 构建安装包

on:
  push:
    branches: [main]
    paths-ignore:
      - 'apk/**'
      - 'promo/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK 30 / build-tools 30.0.3
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM="$(command -v sdkmanager)"; fi
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" --install "platforms;android-30" "build-tools;30.0.3" "platform-tools" >/dev/null
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK=$SDK_DIR" >> "$GITHUB_ENV"

      - name: 恢复固定签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p .toolchain
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > .toolchain/debug.keystore
            echo "已恢复固定签名密钥，本次发版与上一版同签名"
          else
            echo "::warning::未配置 KEYSTORE_B64，本次为临时密钥，装新版需卸载旧版"
          fi

      - name: 构建 APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -o pipefail
          echo "== 构建环境 ==" > build.log
          echo "HEAD: $(git rev-parse HEAD)" >> build.log
          grep -n versionCode app/build.gradle >> build.log
          find app/src/main/java -name "*.java" | sort >> build.log
          echo "== 构建输出 ==" >> build.log
          bash build_apk.sh 2>&1 | tee -a build.log

      - name: 失败时把构建日志写回仓库
        if: failure()
        run: |
          if [ -f build.log ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f build.log
            git commit -m "[skip ci] 构建日志" || true
            git push || true
          fi

      - name: 读取版本号
        id: ver
        run: |
          VER=$(grep -oE 'versionName[[:space:]]+"[^"]+"' app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/' | head -1)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "path=apk/看得清-$VER.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: 看得清-${{ steps.ver.outputs.ver }}
          path: ${{ steps.ver.outputs.path }}
          if-no-files-found: error

      - name: 把安装包提交回 apk/
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          APK="${{ steps.ver.outputs.path }}"
          VER="${{ steps.ver.outputs.ver }}"
          cp "$APK" apk/kandeqing-latest.apk
          cp "$APK" docs/kandeqing-latest.apk
          python3 tools/make_feed.py apk docs --repo "$GITHUB_REPOSITORY"
          git add -f "$APK" apk/kandeqing-latest.apk docs/kandeqing-latest.apk \
            docs/feed.atom docs/feed.json \
            docs/subscribe.atom docs/subscribe.json tools/make_feed.py
          if git diff --cached --quiet; then
            echo "安装包无变化，跳过提交"
          else
            git commit -m "[skip ci] 构建 看得清 ${{ steps.ver.outputs.ver }} 安装包"
            git push
          fi

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          APK="${{ steps.ver.outputs.path }}"
          NAME="kanqing-$VER.apk"
          NOTES="看得清 3.9.22：接回被 3.9.21 层级改造弄坏的调节控件，并把诊断日志入口接回第四选项卡。逐条核对 12 条「控件 → 回调 → 存值 → 服务生效」链路，回调其实一行没删，坏在 3.9.21 把 ROW_SLIDER 56→48、ROW_SELECT 48→44 后，sliderRow / SelectRow 仍用固定行高，内容溢出被裁，SeekBar 拖不到、下拉展开被压，于是「不透明度 / 发音人」这些看着全都不管用。这版把两者外层改成 WRAP_CONTENT + setMinimumHeight，SeekBar 给足 36dp，所有滑块和下拉完整可点；层级收紧的视觉效果保留。音色链再加固：回前台重新枚举音色、空列表不再静默失败、选中即强制 applyVoice 并给可见反馈。诊断与日志按早期版本（7ab4511ce）的折叠二级入口接回「更多」页：查看 / 复制 / 导出 / 刷新 / 显示全部 / 清空，接 Log.recent/content/export/clear，只记状态与字数不记正文。配色、抓字、放大、球定位、四态、剪贴板链路、TTS 其余一行没动。Release 仍额外上传固定名 kandeqing-latest.apk，订阅源不变。verify_all 8 套三轮全绿。versionCode 52 可覆盖升级，固定签名不变。详见 CHANGELOG.md。"
          if ! gh release view "v$VER" >/dev/null 2>&1; then
            gh release create "v$VER" --title "看得清 $VER" --notes "$NOTES"
          fi
          RID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VER" --jq .id)
          for AID in $(gh api "repos/$GITHUB_REPOSITORY/releases/$RID/assets" --jq '.[].id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$AID" >/dev/null
          done
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$APK" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RID/assets?name=$NAME" >/dev/null
          echo "已发布 $NAME"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$APK" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RID/assets?name=kandeqing-latest.apk" >/dev/null
          echo "已发布固定订阅名 kandeqing-latest.apk"
          echo "固定直链已同步：仓库 apk/ 与 Pages docs/ 各一份（不重定向，下载器可直接订阅）"
