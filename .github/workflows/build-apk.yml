name: 构建安装包

on:
  push:
    branches: [main]
    paths-ignore:
      - 'apk/**'
      - 'promo/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK 30 / build-tools 30.0.3
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM="$(command -v sdkmanager)"; fi
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" --install "platforms;android-30" "build-tools;30.0.3" "platform-tools" >/dev/null
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK=$SDK_DIR" >> "$GITHUB_ENV"

      - name: 恢复固定签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p .toolchain
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > .toolchain/debug.keystore
            echo "已恢复固定签名密钥，本次发版与上一版同签名"
          else
            echo "::warning::未配置 KEYSTORE_B64，本次为临时密钥，装新版需卸载旧版"
          fi

      - name: 构建 APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -o pipefail
          echo "== 构建环境 ==" > build.log
          echo "HEAD: $(git rev-parse HEAD)" >> build.log
          grep -n versionCode app/build.gradle >> build.log
          find app/src/main/java -name "*.java" | sort >> build.log
          echo "== 构建输出 ==" >> build.log
          bash build_apk.sh 2>&1 | tee -a build.log

      - name: 失败时把构建日志写回仓库
        if: failure()
        run: |
          if [ -f build.log ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f build.log
            git commit -m "[skip ci] 构建日志" || true
            git push || true
          fi

      - name: 读取版本号
        id: ver
        run: |
          VER=$(grep -oE 'versionName[[:space:]]+"[^"]+"' app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/' | head -1)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "path=apk/看得清-$VER.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: 看得清-${{ steps.ver.outputs.ver }}
          path: ${{ steps.ver.outputs.path }}
          if-no-files-found: error

      - name: 把安装包提交回 apk/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "${{ steps.ver.outputs.path }}"
          if git diff --cached --quiet; then
            echo "安装包无变化，跳过提交"
          else
            git commit -m "[skip ci] 构建 看得清 ${{ steps.ver.outputs.ver }} 安装包"
            git push
          fi

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          APK="${{ steps.ver.outputs.path }}"
          NAME="kanqing-$VER.apk"
          NOTES="看得清 3.9.17：按住放大时，球心就是触点。把 3.9.11 以来加的原点差测量、偏心量扣减、相对直写、坐标换算全部删掉，放大态定位只剩一行 lp = 触点 - 半宽（按住、移动、松手三处同一行）。没有第二个变量，不测状态栏、不猜 ROM、不猜窗口会不会被放大。闲置拖球保持按下偏移不变，四种球形态、抓字链路、TTS、UI 都没动。verify_ball.py 改为静态断言「不许再出现任何补偿」+ 球心恒等触点的数值用例与反向用例。verify_all 6 suite 三轮全绿。versionCode 47 可覆盖升级，固定签名不变。详见 CHANGELOG.md。"
          if ! gh release view "v$VER" >/dev/null 2>&1; then
            gh release create "v$VER" --title "看得清 $VER" --notes "$NOTES"
          fi
          RID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VER" --jq .id)
          for AID in $(gh api "repos/$GITHUB_REPOSITORY/releases/$RID/assets" --jq '.[].id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$AID" >/dev/null
          done
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$APK" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RID/assets?name=$NAME" >/dev/null
          echo "已发布 $NAME"
