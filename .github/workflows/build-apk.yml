name: 构建安装包

on:
  push:
    branches: [main]
    # 安装包回传、纯文档改动都不再触发，避免自己触发自己
    paths-ignore:
      - 'apk/**'
      - 'promo/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK 30 / build-tools 30.0.3
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM="$(command -v sdkmanager)"; fi
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" --install "platforms;android-30" "build-tools;30.0.3" "platform-tools" >/dev/null
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK=$SDK_DIR" >> "$GITHUB_ENV"

      - name: 恢复固定签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p .toolchain
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > .toolchain/debug.keystore
            echo "已恢复固定签名密钥，本次发版与上一版同签名"
          else
            echo "::warning::未配置 KEYSTORE_B64，本次为临时密钥，装新版需卸载旧版"
          fi

      - name: 构建 APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        # tee 落盘：CI 日志端点被网络策略拦时，还能从仓库里读到真实构建过程
        run: |
          # Actions 默认 shell 只有 -e，不带 pipefail：
          # `cmd | tee` 会把失败脚本的退出码吞成 tee 的 0，出现过「假成功发旧包」。
          set -o pipefail
          echo "== 构建环境 ==" > build.log
          echo "HEAD: $(git rev-parse HEAD)" >> build.log
          grep -n versionCode app/build.gradle >> build.log
          find app/src/main/java -name "*.java" | sort >> build.log
          echo "== 构建输出 ==" >> build.log
          bash build_apk.sh 2>&1 | tee -a build.log

      - name: 失败时把构建日志写回仓库
        if: failure()
        run: |
          if [ -f build.log ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f build.log
            git commit -m "[skip ci] 构建日志" || true
            git push || true
          fi

      - name: 读取版本号
        id: ver
        run: |
          VER=$(grep -oE 'versionName[[:space:]]+"[^"]+"' app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/' | head -1)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "path=apk/看得清-$VER.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: 看得清-${{ steps.ver.outputs.ver }}
          path: ${{ steps.ver.outputs.path }}
          if-no-files-found: error

      - name: 把安装包提交回 apk/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "${{ steps.ver.outputs.path }}"
          if git diff --cached --quiet; then
            echo "安装包无变化，跳过提交"
          else
            git commit -m "[skip ci] 构建 看得清 ${{ steps.ver.outputs.ver }} 安装包"
            git push
          fi

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          APK="${{ steps.ver.outputs.path }}"
          # Release 资产名用 ASCII：接口会把中文字符裁掉（变成 "-3.6.apk"），
          # 仓库 apk/ 里的中文文件名保留，两者是同一个包。
          NAME="kanqing-$VER.apk"
          NOTES="看得清 3.9：修断句起点、延迟、复杂界面抓字、无反馈。① 断句——3.8 的段内起点只用 x/段宽×全文长度，丢掉 y（行号），长文自动换行时点在行首一律估到全文前 10% 再被 sentenceStart 推到篇头；3.9 在预扫阶段取逐字矩形（后台、纯数据缓存），点字时二维最近字符定位，句起点只在命中字附近找、绝不静默退 0，拿不到逐字位置时按 y 比例估行。② 延迟——3.8 把预扫和点字兜底都投到同一个 grabH，用户快点字时兜底要排队等整树预扫跑完再自己遍历一遍，延迟翻倍；3.9 拆出独立 prepH，并在点球时主线程做一次极浅扫（300 节点）让缓存立刻可用，覆盖层撤除也改异步。③ 复杂界面——3.8 collect() 只取第一个收到文字的窗口就 return，Dialog / WebView / 分屏的正文全丢；3.9 合并所有非装饰窗口、按 layer 分组命中，父子树稳健去重，预算放宽到 30000/1200，剥 WebView 的 HTML 标签，并监听内容变化/滚屏节流重扫。④ 反馈——抬手立刻轻震（不依赖抓字结果），抓不到字时长震+明确文案+球回待命，诊断日志只记结构数字不记内容。versionCode 30 可覆盖升级，固定签名不变，Logo 仍为 3.6 蓝色玻璃球。详见 CHANGELOG.md。"
          if ! gh release view "v$VER" >/dev/null 2>&1; then
            gh release create "v$VER" --title "看得清 $VER" --notes "$NOTES"
          fi
          RID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VER" --jq .id)
          for AID in $(gh api "repos/$GITHUB_REPOSITORY/releases/$RID/assets" --jq '.[].id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$AID" >/dev/null
          done
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$APK" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RID/assets?name=$NAME" >/dev/null
          echo "已发布 $NAME"
