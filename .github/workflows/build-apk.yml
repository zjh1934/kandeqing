name: 构建安装包

on:
  push:
    branches: [main]
    # 安装包回传、纯文档改动都不再触发，避免自己触发自己
    paths-ignore:
      - 'apk/**'
      - 'promo/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK 30 / build-tools 30.0.3
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM="$(command -v sdkmanager)"; fi
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" --install "platforms;android-30" "build-tools;30.0.3" "platform-tools" >/dev/null
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK=$SDK_DIR" >> "$GITHUB_ENV"

      - name: 恢复固定签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p .toolchain
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > .toolchain/debug.keystore
            echo "已恢复固定签名密钥，本次发版与上一版同签名"
          else
            echo "::warning::未配置 KEYSTORE_B64，本次为临时密钥，装新版需卸载旧版"
          fi

      - name: 构建 APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        # tee 落盘：CI 日志端点被网络策略拦时，还能从仓库里读到真实构建过程
        run: |
          # Actions 默认 shell 只有 -e，不带 pipefail：
          # `cmd | tee` 会把失败脚本的退出码吞成 tee 的 0，出现过「假成功发旧包」。
          set -o pipefail
          echo "== 构建环境 ==" > build.log
          echo "HEAD: $(git rev-parse HEAD)" >> build.log
          grep -n versionCode app/build.gradle >> build.log
          find app/src/main/java -name "*.java" | sort >> build.log
          echo "== 构建输出 ==" >> build.log
          bash build_apk.sh 2>&1 | tee -a build.log

      - name: 失败时把构建日志写回仓库
        if: failure()
        run: |
          if [ -f build.log ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f build.log
            git commit -m "[skip ci] 构建日志" || true
            git push || true
          fi

      - name: 读取版本号
        id: ver
        run: |
          VER=$(grep -oE 'versionName[[:space:]]+"[^"]+"' app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/' | head -1)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "path=apk/看得清-$VER.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: 看得清-${{ steps.ver.outputs.ver }}
          path: ${{ steps.ver.outputs.path }}
          if-no-files-found: error

      - name: 把安装包提交回 apk/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "${{ steps.ver.outputs.path }}"
          if git diff --cached --quiet; then
            echo "安装包无变化，跳过提交"
          else
            git commit -m "[skip ci] 构建 看得清 ${{ steps.ver.outputs.ver }} 安装包"
            git push
          fi

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          APK="${{ steps.ver.outputs.path }}"
          # Release 资产名用 ASCII：接口会把中文字符裁掉（变成 "-3.6.apk"），
          # 仓库 apk/ 里的中文文件名保留，两者是同一个包。
          NAME="kanqing-$VER.apk"
          NOTES="看得清 3.9.5：按触点坐标在多层分级页面里定位，修「点这里读那里」和「经常抓不到字」。根因经镜像复现实锤：① 旧版每扫一个窗口只要 pick!=null 就立刻 return，上层窗口哪怕只是整张卡片/标题栏这种包裹型大节点也直接胜出，下层真正正文没机会；② 命中只认 r.contains(px,py) 严格包含，多层页面里文字节点之间全是行间距/padding/卡片留白，点在空隙一个都命中不了，fallback 却取「最上层那个有内容的窗口」，从不相干处读起；③ 逐字位置拿不到时按整块 bounds 的 ry×0.85+rx×0.15 估全文比例，同一行上下点几像素下标就跳；④ isVisibleToUser 误报只在整窗收不到时才重扫；⑤ 自定义控件只有 hint/tooltip/state/paneTitle 时判定没读到字；⑥ screenRect 用 getMetrics 与 getRawX/Y 不同源，带导航栏机型会丢底部内容。本版改法（全部在 TextGrabber 内部，不加类、不加线程、不碰 ComboService/BallController/移动逻辑）：扫完所有窗口再按触点坐标全局比较——精确命中跨窗口取面积最小那段；无精确命中取离触点最近的一段（距离 y 权重加倍，48dp 容差）；逐字位置只在容差内的近邻段上请求，避免延迟回归；fallbackStart 改为按 y 落行、行内按 x 估，单行时 y 完全不参与；触点落在块内就信触点不信 ROM 可见性误判，并用 visibleSkipped 记账决定是否需要关过滤重扫；nodeText 反射补读 hint/tooltip/stateDescription/paneTitle；screenRect 改 getRealMetrics。verify_grabber.py 与 verify_textlayout.py 镜像同步，新增 6 个用例含旧行为反向验证，五个多层场景实测：行间留白命中、跨窗口取最小段、误报不可见、hint 文字、单行不跳字。基线 5 suite 三轮全绿、17 个 Java 语法全过。核心代码仍是 3.9.2 还原后的早期版本，Logo 仍是 3.6 蓝色玻璃球。versionCode 35 可覆盖升级，固定签名不变。详见 CHANGELOG.md。"
          if ! gh release view "v$VER" >/dev/null 2>&1; then
            gh release create "v$VER" --title "看得清 $VER" --notes "$NOTES"
          fi
          RID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VER" --jq .id)
          for AID in $(gh api "repos/$GITHUB_REPOSITORY/releases/$RID/assets" --jq '.[].id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$AID" >/dev/null
          done
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$APK" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RID/assets?name=$NAME" >/dev/null
          echo "已发布 $NAME"
