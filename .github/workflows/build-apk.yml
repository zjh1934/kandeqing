name: 构建安装包

on:
  push:
    branches: [main]
    paths-ignore:
      - 'apk/**'
      - 'promo/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 提交前自检（10 套：AOCI 认知漂移 + 对外页面口径）
        run: python3 verify_all.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK 30 / build-tools 30.0.3
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM="$(command -v sdkmanager)"; fi
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" --install "platforms;android-30" "build-tools;30.0.3" "platform-tools" >/dev/null
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK=$SDK_DIR" >> "$GITHUB_ENV"

      - name: 恢复固定签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p .toolchain
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > .toolchain/debug.keystore
            echo "已恢复固定签名密钥，本次发版与上一版同签名"
          else
            echo "::warning::未配置 KEYSTORE_B64，本次为临时密钥，装新版需卸载旧版"
          fi

      - name: 构建 APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -o pipefail
          echo "== 构建环境 ==" > build.log
          echo "HEAD: $(git rev-parse HEAD)" >> build.log
          grep -n versionCode app/build.gradle >> build.log
          find app/src/main/java -name "*.java" | sort >> build.log
          echo "== 构建输出 ==" >> build.log
          bash build_apk.sh 2>&1 | tee -a build.log

      - name: 失败时把构建日志写回仓库
        if: failure()
        run: |
          if [ -f build.log ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f build.log
            git commit -m "[skip ci] 构建日志" || true
            git push || true
          fi

      - name: 读取版本号
        id: ver
        run: |
          VER=$(grep -oE 'versionName[[:space:]]+"[^"]+"' app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/' | head -1)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "path=apk/kandeqing-v$VER.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: kandeqing-v${{ steps.ver.outputs.ver }}
          path: ${{ steps.ver.outputs.path }}
          if-no-files-found: error

      - name: 把安装包提交回 apk/
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          APK="${{ steps.ver.outputs.path }}"
          VER="${{ steps.ver.outputs.ver }}"
          cp "$APK" apk/kandeqing-latest.apk
          cp "$APK" docs/kandeqing-latest.apk
          python3 tools/make_feed.py apk docs --repo "$GITHUB_REPOSITORY"
          git add -f "$APK" apk/kandeqing-latest.apk docs/kandeqing-latest.apk \
            docs/feed.atom docs/feed.json \
            docs/subscribe.atom docs/subscribe.json tools/make_feed.py
          if git diff --cached --quiet; then
            echo "安装包无变化，跳过提交"
          else
            git commit -m "[skip ci] 构建 看得清 ${{ steps.ver.outputs.ver }} 安装包"
            git push
          fi

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          APK="${{ steps.ver.outputs.path }}"
          NAME="kandeqing-v$VER.apk"
          NOTES="看得清 3.9.24：设置页开关重做，开 / 关一眼分得清。旧版用系统 Switch 的 thumb/track tint 染色，浅色主题下轨道是极淡的 #E6EEFF / #D8DDE7，部分 ROM 上系统轨道本身近乎透明，于是截图里只剩一个灰圆点或蓝圆点，看不出是开关、更分不清状态。现在不再依赖 tint：轨道与圆钮全部代码自绘，关闭态是明确的灰色胶囊底 + 白色圆钮在左，开启态是实心蓝胶囊底 + 白色圆钮在右；显式 setSplitTrack(false)、清空 thumb/track tintList，深浅主题都清晰；整行也可点击。设置页十来个开关与首页主开关共用同一个 makeSwitch 工厂，回调电路、Prefs 读写、无障碍开关逻辑一行没动。改前 / 改后对照预览图见 Pages 与 docs/preview/switch-track-before-after.png。抓字、放大、球心对齐、四态形态、剪贴板链路、两个独立球、TTS、诊断日志全没碰。verify_all 10 套三轮全绿，versionCode 54，固定签名不变，可直接覆盖安装。订阅（全部历史版本）：https://cdn.jsdelivr.net/gh/zjh1934/kandeqing@main/docs/feed.atom ；固定直链（永远最新）：https://raw.githubusercontent.com/zjh1934/kandeqing/main/apk/kandeqing-latest.apk ；详情见 CHANGELOG.md。"
          if ! gh release view "v$VER" >/dev/null 2>&1; then
            gh release create "v$VER" --title "看得清 $VER" --notes "$NOTES"
          fi
          RID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VER" --jq .id)
          for AID in $(gh api "repos/$GITHUB_REPOSITORY/releases/$RID/assets" --jq '.[].id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$AID" >/dev/null
          done
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$APK" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RID/assets?name=$NAME" >/dev/null
          echo "已发布 $NAME"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$APK" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RID/assets?name=kandeqing-latest.apk" >/dev/null
          echo "已发布固定订阅名 kandeqing-latest.apk"
          echo "固定直链已同步：仓库 apk/ 与 Pages docs/ 各一份（不重定向，下载器可直接订阅）"

      - name: 刷新订阅源 CDN 缓存
        if: always()
        run: |
          for P in docs/feed.atom docs/feed.json docs/subscribe.atom docs/subscribe.json; do
            curl -fsS -m 20 -X POST "https://purge.jsdelivr.net/" \
              -H "Content-Type: application/json" \
              -d "{\"path\":[\"/gh/$GITHUB_REPOSITORY@main/$P\"]}" \
              && echo "已刷新 $P" || echo "刷新 $P 失败（不影响发版）"
          done
